<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero retro · búsqueda laboral</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d3524; overflow: hidden; }
  canvas#pantalla { display: block; image-rendering: pixelated; }
  .caja {
    position: fixed; font: bold 15px/1.45 "Courier New", ui-monospace, monospace; color: #20203a;
    background: #fbfaf2; border: 4px solid #2a2a4a; border-radius: 6px;
    box-shadow: inset 0 0 0 3px #fbfaf2, inset 0 0 0 5px #7a86b8, 0 4px 0 rgba(0,0,0,.35);
  }
  #hud { bottom: 12px; left: 12px; padding: 8px 12px; font-size: 13px; }
  #hud b { color: #b0302a; }
  #ayuda { bottom: 12px; right: 12px; padding: 6px 10px; font-size: 12px; }
  #ayuda .m { color: #3a4a8a; }
  #dialogo {
    left: 50%; bottom: 16px; transform: translateX(-50%); width: min(780px, calc(100vw - 48px));
    padding: 14px 18px 18px; display: none; max-height: 45vh; overflow: auto; box-sizing: border-box; z-index: 3;
  }
  #dialogo.grande { max-height: 62vh; }
  #dialogo.abierto { display: block; }
  #dialogo h2 { margin: 0 0 6px; font-size: 17px; }
  #dialogo h3 { margin: 12px 0 4px; font-size: 15px; color: #3a4a8a; }
  #dialogo h4 { margin: 8px 0 2px; font-size: 14px; }
  #dialogo p { margin: 4px 0; }
  #dialogo ul { margin: 6px 0 0; padding-left: 0; list-style: none; }
  #dialogo li { margin: 3px 0; padding-left: 18px; position: relative; }
  #dialogo .md li::before { content: "▸"; position: absolute; left: 2px; color: #7a86b8; }
  #dialogo .md p, #dialogo .md li { font-weight: normal; }
  #dialogo .md b { font-weight: bold; }
  #dialogo code { background: #eceadc; padding: 0 3px; }
  #dialogo a { color: #3a4a8a; }
  #dialogo li .cursor { position: absolute; left: 0; }
  #dialogo li.elegida { background: #eef0ff; }
  #dialogo .teclas, #dialogo .pregunta { margin-top: 10px; font-size: 13px; }
  #dialogo .pregunta { color: #b0302a; }
  #dialogo .sigue { position: sticky; float: right; bottom: 0; animation: parpadeo 1s steps(2) infinite; }
  #dialogo .valor { color: #3a4a8a; }
  .p-alta { color: #c0302a; } .p-media { color: #b87a00; } .p-baja { color: #4a6a9a; }
  .tenue { color: #6a6a80; font-weight: normal; }
  .rojo { color: #c0302a; } .amarillo { color: #b87a00; } .gris { color: #6a6a80; } .verde { color: #3e8f4a; }
  .barra { letter-spacing: 1px; color: #3e8f4a; }
  .barra .vacia { color: #c8c8d4; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  .tecla { display: inline-block; padding: 0 5px; border: 2px solid #2a2a4a; border-radius: 3px; background: #fff; color: #20203a; }
  #aviso { top: 14px; left: 50%; transform: translate(-50%, -90px); padding: 8px 14px; transition: transform .2s; z-index: 5; }
  #aviso.visible { transform: translate(-50%, 0); }
  #error { top: 40%; left: 50%; transform: translateX(-50%); padding: 16px 20px; display: none; max-width: 520px; }
  #fundido { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 4; }
  #fundido.negro { opacity: 1; }
</style>
</head>
<body>
<canvas id="pantalla"></canvas>
<div id="hud" class="caja">Cargando el pueblo…</div>
<div id="ayuda" class="caja"></div>
<div id="dialogo" class="caja" role="dialog" aria-live="polite"></div>
<div id="error" class="caja"></div>
<div id="aviso" class="caja"></div>
<div id="fundido"></div>

<script>
(function () {
  "use strict";

  // Un pueblo en pixel art armado con postulaciones.json.
  // Cada columna del tablero es un barrio y cada postulación es una casa con su interior.
  // Un «!» marca acciones pendientes. Los cambios pasan por el servidor del tablero, igual que en tablero.html.

  var T = 16;            // lado de una baldosa, en píxeles del mundo
  var ANCHO = 48;        // ancho del pueblo, en baldosas
  var PASO = 0.14;       // segundos por baldosa caminando (velocidad 1)
  var modoEjemplo = /[?&]ejemplo\b/.test(location.search);

  var ZONAS = {
    "por-enviar":   { nombre: "Por enviar",          techo: ["#e0a83a", "#b07a1e"], papel: ["#f4e2b0", "#ead098"] },
    "conversacion": { nombre: "En conversación",     techo: ["#d8503a", "#9a2e22"], papel: ["#f4c8b8", "#eab4a0"] },
    "esperando":    { nombre: "Esperando respuesta", techo: ["#4a7ad0", "#2e4f94"], papel: ["#c4d6f2", "#b0c6ea"] },
    "cerrada":      { nombre: "Cerradas",            techo: ["#9a9aa8", "#6a6a78"], papel: ["#d4d4da", "#c4c4cc"] }
  };
  var MUDABLES = ["por-enviar", "esperando", "conversacion"];
  var RESULTADOS = { "descartada": "Descartada", "descartada-por-mi": "Descartada por mí", "retirada": "Me retiré",
    "sin-respuesta": "Sin respuesta", "oferta-aceptada": "Oferta aceptada", "oferta-rechazada": "Oferta rechazada" };
  var PRIORIDAD = { alta: 0, media: 1, baja: 2 };
  var COLOR_PRIORIDAD = { alta: "#d8302a", media: "#e0a000", baja: "#5a7ab0" };
  var DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  var DIAS_LARGOS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  var MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

  var C = {
    pasto: "#8fd07c", mata: "#4f9a4a", pastoGris: "#9fb894", pastoGris2: "#8aa680",
    camino: "#ead69c", camino2: "#d2bb7a", piedra: "#cfcfd8", piedra2: "#a8a8b8",
    arbol1: "#2c6638", arbol2: "#3f8f4a", arbol3: "#66b65c", tronco: "#7a4b2a",
    agua: "#5aa8e8", agua2: "#a8dcff", madera: "#a8743c", madera2: "#7a5028",
    pared: "#f4eadc", borde: "#4a3a32", puerta: "#8a5a32", vidrio: "#9fd4f4", luz: "#ffd860",
    piso: "#c88c50", piso2: "#a8703c", piso3: "#d89c60"
  };

  // ---------- configuración (queda guardada en este navegador) ----------
  var CLAVE_CONFIG = "tablero-retro-config";
  var config = { dia: "auto", velocidad: 1, musica: true, efectos: true, minimapa: false, pos: null };
  function leerConfig() {
    try { Object.assign(config, JSON.parse(localStorage.getItem(CLAVE_CONFIG) || "{}")); } catch (e) {}
    config.velocidad = +config.velocidad >= 2 ? 2 : 1; // dos opciones: caminando (1) o en bicicleta (2)
  }
  leerConfig();
  function guardarConfig() { try { localStorage.setItem(CLAVE_CONFIG, JSON.stringify(config)); } catch (e) {} }

  // ---------- utilidades ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function hoyISO() { return iso(new Date()); }
  function haceDias(n) { var d = new Date(); d.setDate(d.getDate() - n); return iso(d); }
  function fechaCorta(f) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(f || "");
    if (!m) return f || "";
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return DIAS[d.getDay()] + " " + m[3] + "/" + m[2];
  }
  function azar(semilla) { // mulberry32: el pueblo se ve igual cada vez que se abre
    return function () {
      semilla |= 0; semilla = semilla + 0x6D2B79F5 | 0;
      var t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function ordenarAcciones(lista) {
    return lista.sort(function (a, b) {
      var pa = PRIORIDAD[a.prioridad] != null ? PRIORIDAD[a.prioridad] : 1, pb = PRIORIDAD[b.prioridad] != null ? PRIORIDAD[b.prioridad] : 1;
      return pa - pb || String(a.fecha || "9999").localeCompare(String(b.fecha || "9999"));
    });
  }
  function momentoDelDia() {
    if (config.dia === "dia") return "dia";
    if (config.dia === "noche") return "noche";
    var h = new Date().getHours();
    return h < 7 || h >= 20 ? "noche" : h >= 18 ? "atardecer" : "dia";
  }

  // Markdown mínimo para mostrar rol.md y empresa.md dentro de las casas.
  function md(texto) {
    var html = "", lista = false;
    function linea(s) {
      s = esc(s);
      return s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }
    function cerrarLista() { if (lista) { html += "</ul>"; lista = false; } }
    String(texto || "").replace(/\r/g, "").split("\n").forEach(function (l) {
      var m;
      if (/^\s*\|?\s*:?-{3,}/.test(l)) return;
      if ((m = /^###+\s+(.*)/.exec(l))) { cerrarLista(); html += "<h4>" + linea(m[1]) + "</h4>"; return; }
      if ((m = /^##\s+(.*)/.exec(l))) { cerrarLista(); html += "<h3>" + linea(m[1]) + "</h3>"; return; }
      if (/^#\s/.test(l)) return;
      if ((m = /^\s*(?:[-*]|\d+\.)\s+(.*)/.exec(l)) || (m = /^\s*\|(.*)\|\s*$/.exec(l))) {
        var item = m[1];
        if (/^\s*\|/.test(l)) item = item.split("|").map(function (x) { return x.trim(); }).filter(Boolean).join(" · ");
        if (!lista) { html += "<ul>"; lista = true; }
        html += "<li>" + linea(item) + "</li>"; return;
      }
      if (!l.trim()) { cerrarLista(); return; }
      cerrarLista(); html += "<p>" + linea(l) + "</p>";
    });
    cerrarLista();
    return '<div class="md">' + html + "</div>";
  }
  function secciones(texto) {
    var out = [], act = { titulo: "", lineas: [] };
    String(texto || "").replace(/\r/g, "").split("\n").forEach(function (l) {
      var m = /^##\s+(.*)/.exec(l);
      if (m) { out.push(act); act = { titulo: m[1].trim(), lineas: [] }; }
      else if (!/^#\s/.test(l)) act.lineas.push(l);
    });
    out.push(act);
    return out.filter(function (s) { return s.lineas.join("").trim(); });
  }
  var RE_ENCAJE = /encaje|por qu[eé] entra|relaci[oó]n con (la experiencia|tu|mi)|recomendaci|qu[eé] ajustar|qu[eé] falta|no pude comprobar|se[nñ]ales/i;
  var RE_EMPRESA = /empresa|^qu[eé] (es|hace)\b(?!\s+(el|la)\s+(rol|[aá]rea|puesto))/i;
  var RE_FUERA = /respuestas|seguimiento|tema elegido|relaci[oó]n con otras|relaci[oó]n con la tarjeta/i;
  function partesDeRol(texto) {
    var r = { rol: [], empresa: [], encaje: [] };
    secciones(texto).forEach(function (s) {
      if (RE_FUERA.test(s.titulo)) return;
      if (RE_ENCAJE.test(s.titulo)) r.encaje.push(s);
      else if (RE_EMPRESA.test(s.titulo)) r.empresa.push(s);
      else r.rol.push(s);
    });
    return r;
  }
  function mdSecciones(lista) {
    return lista.map(function (s) { return (s.titulo ? "## " + s.titulo + "\n" : "") + s.lineas.join("\n"); }).join("\n\n");
  }

  // ---------- datos ----------
  function cargarDatos(listo) {
    var s = document.createElement("script");
    s.src = (modoEjemplo ? "ejemplo.js" : "datos.js") + "?t=" + Date.now();
    s.onload = function () {
      var d = modoEjemplo ? (typeof window.DATOS_EJEMPLO === "function" ? window.DATOS_EJEMPLO() : window.DATOS_EJEMPLO) : window.DATOS_TABLERO;
      if (!d) return fallar();
      listo(d);
    };
    s.onerror = fallar;
    document.head.appendChild(s);
  }
  function fallar() {
    var e = document.getElementById("error");
    e.style.display = "block";
    e.innerHTML = "No encontré los datos del tablero. Abrí el tablero retro con <b>tablero/abrir-tablero-retro</b> (.bat en Windows, .command en Mac): " +
      "levanta el servidor local y abre esta página. Para ver un pueblo de prueba, agregá <b>?ejemplo</b> a la dirección.";
    document.getElementById("hud").style.display = "none";
  }
  var practicas = [];
  var practicaDe = {};
  function cargarPracticas() {
    if (modoEjemplo || !window.fetch) return;
    fetch("/api/practicas", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      practicas = ((j && j.practicas) || []).filter(function (p) { return !p.error; });
      practicaDe = {};
      practicas.forEach(function (p) { if (p.postulacion) practicaDe[p.postulacion] = p.carpeta; });
    }, function () {});
  }
  var detalles = {};
  function cargarDetalles(id, listo) {
    if (detalles[id] && detalles[id].estado === "listo") return listo();
    if (modoEjemplo) { detalles[id] = { estado: "error", error: "En el pueblo de prueba no hay carpetas para leer." }; return listo(); }
    detalles[id] = { estado: "cargando" };
    fetch("/api/postulacion?id=" + encodeURIComponent(id), { cache: "no-store" }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; }, function () { return { ok: false, j: {} }; });
    }).then(function (res) {
      detalles[id] = res.ok ? Object.assign({ estado: "listo" }, res.j) : { estado: "error", error: res.j.error || "No pude leer la carpeta." };
      listo();
    }, function () { detalles[id] = { estado: "error", error: "El servidor del tablero no respondió." }; listo(); });
  }

  // Cuánto hace que no se sincroniza el correo, con la regla de colores del buzón.
  function estadoSync() {
    var s = (datosActuales && datosActuales.sync) || {};
    if (!s.ultima) return { color: "rojo", horas: null, texto: "Todavía no se sincronizó el correo desde el tablero." };
    var d = new Date(String(s.ultima).replace(" ", "T"));
    var horas = (Date.now() - d.getTime()) / 36e5;
    if (isNaN(horas)) return { color: "rojo", horas: null, texto: "No entiendo la fecha de la última sincronización (" + s.ultima + ")." };
    var color = horas > 20 ? "rojo" : horas > 6 ? "amarillo" : horas > 2 ? "gris" : null;
    var hace = horas < 1 ? "hace menos de una hora" : horas < 48 ? "hace " + Math.floor(horas) + " h" : "hace " + Math.floor(horas / 24) + " días";
    return { color: color, horas: horas, texto: "Última sincronización: " + hace + " (" + String(s.ultima).replace("T", " ") + ")." };
  }
  var COLOR_SOBRE = { gris: "#8a8a9a", amarillo: "#e0a000", rojo: "#d8302a" };

  // ---------- el pueblo ----------
  var mapa = null, capaFija = null, pueblo = null, escena = "pueblo", casaActual = null;

  function porFila(ancho) { return Math.max(1, Math.floor((ancho - 1) / 4)); }
  function nuevaGrilla(ancho, alto, suelo) {
    var g = { suelo: [], solido: [], cosa: [] };
    for (var j = 0; j < alto; j++) {
      g.suelo.push([]); g.solido.push([]); g.cosa.push([]);
      for (var i = 0; i < ancho; i++) { g.suelo[j].push(suelo); g.solido[j].push(false); g.cosa[j].push(null); }
    }
    return g;
  }

  function armarPueblo(datos) {
    var grupos = { "por-enviar": [], "conversacion": [], "esperando": [], "cerrada": [] };
    (datos.postulaciones || []).forEach(function (p) { (grupos[p.columna] || grupos.esperando).push(p); });
    Object.keys(grupos).forEach(function (k) { // en cada barrio, las casas van por orden alfabético
      grupos[k].sort(function (a, b) { return String(a.empresa || a.id).localeCompare(String(b.empresa || b.id), "es", { sensitivity: "base" }); });
    });

    var pendientes = {}, generales = [], ids = {};
    (datos.postulaciones || []).forEach(function (p) { ids[p.id] = true; });
    (datos.acciones || []).forEach(function (a) {
      if (a.hecha) return;
      if (a.postulacion && ids[a.postulacion]) (pendientes[a.postulacion] = pendientes[a.postulacion] || []).push(a);
      else generales.push(a);
    });
    Object.keys(pendientes).forEach(function (k) { ordenarAcciones(pendientes[k]); });
    ordenarAcciones(generales);

    function alturaZona(n, ancho) { return 2 + Math.max(1, Math.ceil(n / porFila(ancho))) * 4; }

    var zCentro = { id: "centro", x: 1, w: ANCHO - 2, y: 1, h: 11 };
    var calle = zCentro.y + 9;
    var y = zCentro.y + zCentro.h;
    var zEnv = { id: "por-enviar", x: 1, w: 19, y: y };
    var zConv = { id: "conversacion", x: 22, w: ANCHO - 23, y: y };
    var alto1 = Math.max(alturaZona(grupos["por-enviar"].length, zEnv.w), alturaZona(grupos.conversacion.length, zConv.w));
    zEnv.h = alto1; zConv.h = alto1;
    y += alto1 + 2;
    var zEsp = { id: "esperando", x: 1, w: ANCHO - 2, y: y };
    zEsp.h = alturaZona(grupos.esperando.length, zEsp.w);
    y += zEsp.h + 2;
    var zCer = { id: "cerrada", x: 1, w: ANCHO - 2, y: y };
    zCer.h = alturaZona(grupos.cerrada.length, zCer.w);
    var alto = y + zCer.h + 1;
    var zonas = [zEnv, zConv, zEsp, zCer];

    var g = nuevaGrilla(ANCHO, alto, "pasto");
    var suelo = g.suelo, solido = g.solido, cosa = g.cosa;
    function poner(i, j, tipo, ent) { if (j >= 0 && j < alto && i >= 0 && i < ANCHO) { cosa[j][i] = { tipo: tipo, ent: ent }; solido[j][i] = true; } }
    function bloque(x, y0, w, h, tipo, ent) { for (var a = 0; a < w; a++) for (var b = 0; b < h; b++) poner(x + a, y0 + b, tipo, ent); }

    // calles
    [calle, zEnv.y + alto1, zEsp.y + zEsp.h].forEach(function (fy, k) {
      for (var i = 1; i < ANCHO - 1; i++) { suelo[fy][i] = "camino"; if (k) suelo[fy + 1][i] = "camino"; }
    });
    for (var j2 = calle; j2 < zEnv.y + alto1; j2++) { suelo[j2][20] = "camino"; suelo[j2][21] = "camino"; }

    // ---- la plaza ----
    var plaza = { x: 2, y: 2, w: 23, h: 7 };
    for (var pj2 = plaza.y; pj2 < plaza.y + plaza.h; pj2++) for (var pi = plaza.x; pi < plaza.x + plaza.w; pi++) suelo[pj2][pi] = "piedra";
    plaza.fuente = { x: 12, y: 4 };
    plaza.tablon = { x: 4, y: 3, w: 2, generales: generales };
    plaza.buzon = { x: 8, y: 3, w: 1 };
    plaza.calendario = { x: 18, y: 3, w: 2 };
    plaza.mudanza = { x: 18, y: 6, w: 4 };
    plaza.faroles = [[2, 2], [24, 2], [2, 8], [24, 8]];
    plaza.bancos = [[8, 7], [13, 7]];
    bloque(12, 4, 3, 2, "fuente");
    bloque(4, 3, 2, 1, "tablon", plaza.tablon);
    poner(8, 3, "buzon", plaza.buzon);
    bloque(18, 3, 2, 1, "calendario", plaza.calendario);
    bloque(18, 6, 3, 2, "mudanza", plaza.mudanza); poner(21, 7, "mudanza", plaza.mudanza);
    plaza.faroles.forEach(function (f) { poner(f[0], f[1], "farol"); });
    plaza.bancos.forEach(function (b) { bloque(b[0], b[1], 2, 1, "banco"); });

    // ---- la universidad, el faro y tu casa ----
    for (var ci = 26; ci < ANCHO - 1; ci++) suelo[7][ci] = "camino";
    var universidad = { tipo: "universidad", x: 27, y: 4, w: 5, h: 3, puerta: { x: 29, y: 6 } };
    var faro = { tipo: "faro", x: 33, y: 2, w: 3, h: 5, puerta: { x: 34, y: 6 } };
    var miCasa = { tipo: "hogar", x: 39, y: 4, w: 4, h: 3, puerta: { x: 40, y: 6 } };
    miCasa.bici = { x: miCasa.puerta.x - 1, y: miCasa.puerta.y + 1 }; // donde descansa la bicicleta
    [universidad, faro, miCasa].forEach(function (e) { bloque(e.x, e.y, e.w, e.h, e.tipo, e); });
    [[37, 3], [44, 3], [45, 5], [25, 2], [43, 7]].forEach(function (a) { poner(a[0], a[1], "arbol"); });

    // ---- los barrios ----
    var casas = [];
    zonas.forEach(function (z) {
      var lista = grupos[z.id];
      z.cantidad = lista.length;
      var n = porFila(z.w);
      var margen = Math.floor((z.w - n * 4) / 2) + 1;
      if (z.id === "cerrada") {
        for (var jj = z.y; jj < z.y + z.h; jj++) for (var ii = z.x; ii < z.x + z.w; ii++) suelo[jj][ii] = "pastoGris";
        for (var i = z.x; i < z.x + z.w; i++) if (Math.abs(i - (z.x + Math.floor(z.w / 2))) > 1) poner(i, z.y, "cerca");
      }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) apagarMusica();
    else if (config.musica && !primerGesto) prenderMusica();
  });
  addEventListener("storage", function (ev) {
    if (ev.key !== CLAVE_CONFIG) return;
    var pos = config.pos;
    leerConfig(); config.pos = pos;
    if (!config.musica) apagarMusica(); else if (!primerGesto && !document.hidden) prenderMusica();
  });

  function copiar(texto) {
    function hecho() { sonar([660, 880]); avisar("Pedido copiado. Pegalo en Claude Code."); }
    function planB() {
      var ta = document.createElement("textarea");
      ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      if (ok) hecho(); else window.prompt("Copiá este texto:", texto);
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texto).then(hecho, planB);
    else planB();
  }

  // Cambios que pasan por el servidor del tablero (los mismos que hace tablero.html).
  function enviarCambio(cambio, exito) {
    if (guardando) return;
    if (modoEjemplo) { nada(); avisar("En el pueblo de prueba no se guardan cambios."); return; }
    guardando = true;
    fetch("/api/cambios", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cambios: [Object.assign({ fecha: hoyISO() }, cambio)] })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; }, function () { return { ok: false, j: {} }; });
    }).then(function (res) {
      guardando = false;
      var r0 = res.ok && res.j.resultados && res.j.resultados[0];
      if (!r0 || !r0.ok) {
        nada();
        avisar("No pude guardarlo: " + ((r0 && r0.motivo) || res.j.error || "el servidor no respondió bien") + ".");
        return;
      }
      exito();
      cargarDatos(reconstruir);
    }, function () {
      guardando = false;
      nada();
      avisar("Se cortó el servidor del tablero. No se guardó nada.");
    });
  }
  function darPorHecha(a) {
    enviarCambio({ tipo: "hecha", id: a.id }, function () { sonar([523, 659, 784, 1047]); avisar("¡Hecha! Quedó guardada en el tablero."); });
  }
  function mudar(p, destino) {
    cerrar();
    enviarCambio({ tipo: "mover", id: p.id, destino: destino }, function () {
      sonar([392, 494, 587, 784]);
      avisar("Mudanza lista: " + p.empresa + " ahora vive en «" + ZONAS[destino].nombre + "».");
    });
  }

  function reconstruir(datos) {
    var antes = dlg ? { tipo: dlg.tipo, sel: dlg.sel } : null;
    datosActuales = datos;
    armarTodoElPueblo();
    if (escena === "casa") {
      var id = casaActual.p.id;
      var nueva = pueblo.mapa.casas.filter(function (c) { return c.p.id === id; })[0];
      if (!nueva) salirYa();
      else {
        casaActual = nueva;
        var x = pj.tx, y = pj.ty, mira = pj.mira;
        mapa = armarInterior(nueva); capaFija = dibujarCapa(mapa);
        ubicar(x, y, mira);
      }
    }
    if (escena === "pueblo") {
      mapa = pueblo.mapa; capaFija = pueblo.capa;
      if (!libre(pj.tx, pj.ty)) ubicar(mapa.inicio.x, mapa.inicio.y, "arriba");
    }
    actualizarHud();
    if (!antes) return;
    if (antes.tipo === "prioridades" || antes.tipo === "calendario" || antes.tipo === "config") { mostrar({ tipo: antes.tipo, items: [], sel: antes.sel, confirmar: false }); return; }
    if (antes.tipo === "mudanza") { cerrar(); return; }
    var c = delante();
    if (!c) { cerrar(); return; }
    abrirDialogo(c, antes.sel);
  }
  function armarTodoElPueblo() {
    var m = armarPueblo(datosActuales);
    pueblo = { mapa: m, capa: dibujarCapa(m), mini: armarMinimapa(m), luces: lucesDe(m) };
  }

  function actualizarHud() {
    var pend = (datosActuales.acciones || []).filter(function (a) { return !a.hecha; }).length;
    var activas = (datosActuales.postulaciones || []).filter(function (p) { return p.columna !== "cerrada"; }).length;
    document.getElementById("hud").innerHTML = "Pueblo de " + esc(datosActuales.persona || "la búsqueda") +
      " · " + activas + " postulaciones activas · <b>" + pend + "</b> pendientes" + (modoEjemplo ? " · <i>prueba</i>" : "");
  }
  function actualizarAyuda() {
    document.getElementById("ayuda").innerHTML = "← ↑ → ↓ moverse · A mirar · Enter prioridades · <span class=\"m\">M minimapa</span>" +
      (escena === "casa" || (escena === "hogar" && mapa.piso === 1) ? " · ↓ por la puerta: salir" : escena === "hogar" ? " · la escalera baja" : "");
  }

  // ---------- teclado ----------
  function cambiarOpcion(o, paso) {
    var i = o.valores.indexOf(config[o.clave]);
    config[o.clave] = o.valores[((i < 0 ? 0 : i) + paso + o.valores.length) % o.valores.length];
    guardarConfig();
    if (o.clave === "musica") { if (config.musica) prenderMusica(); else apagarMusica(); }
    if (o.clave === "velocidad" && config.velocidad === 1) bici = { x: pueblo.mapa.miCasa.bici.x, y: pueblo.mapa.miCasa.bici.y };
    if (o.clave === "velocidad" && config.velocidad === 2 && !bici) bici = { x: pueblo.mapa.miCasa.bici.x, y: pueblo.mapa.miCasa.bici.y };
    if (o.clave === "dia" && escena === "hogar") capaFija = dibujarCapa(mapa);
    sonar([587], "square", 0.05);
    pintarDialogo();
  }

  function teclaEnDialogo(ev, k) {
    var items = dlg.items, it = items[dlg.sel];
    if (ev.key.length > 1 && !DIRS[ev.key] && k !== "enter" && k !== "escape") return;
    ev.preventDefault();
    if (dlg.confirmar) {
      if (k === "d" || k === "a" || k === "enter") { dlg.confirmar = false; darPorHecha(it.a); pintarDialogo(); }
      else if (k === "escape" || k === "s") { dlg.confirmar = false; pintarDialogo(); }
      else nada();
      return;
    }
    if (ev.key === "ArrowUp" || ev.key === "ArrowDown") {
      if (items.length > 1) {
        dlg.sel = (dlg.sel + (ev.key === "ArrowUp" ? -1 : 1) + items.length) % items.length;
        sonar([440], "square", 0.05); pintarDialogo();
      } else dialogo.scrollTop += ev.key === "ArrowUp" ? -60 : 60;
      return;
    }
    if (dlg.tipo === "config") {
      if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") return cambiarOpcion(it.o, ev.key === "ArrowLeft" ? -1 : 1);
      if (k === "a" || k === " ") return cambiarOpcion(it.o, 1);
      if (k === "escape" || k === "enter") return cerrar();
      if (k === "m") { config.minimapa = !config.minimapa; guardarConfig(); return pintarDialogo(); }
      return nada();
    }
    if (dlg.tipo === "mudanza") {
      if (k === "a" || k === "enter" || k === " ") {
        if (!it) return nada();
        if (it.tipo === "post") { dlg.post = it.p; dlg.sel = 0; sonar([523], "square", 0.06); return pintarDialogo(); }
        if (it.tipo === "destino") return mudar(dlg.post, it.destino);
        if (it.tipo === "cerrar") { copiar(pedidoCerrar(dlg.post)); return; }
      }
      if (k === "escape") { if (dlg.post) { dlg.post = null; dlg.sel = 0; return pintarDialogo(); } return cerrar(); }
      if (DIRS[ev.key]) return;
      return nada();
    }
    if (DIRS[ev.key]) return;
    if (k === "s") {
      if (!it) return nada();
      if (it.tipo === "accion") return copiar(pedidoDeAccion(it.a));
      if (it.tipo === "preparar") return copiar(pedidoPreparar(casaActual.p));
      if (it.tipo === "perfil") return copiar(pedidoPerfil());
      if (it.tipo === "analizar") return copiar(pedidoAnalizar(casaActual.p));
      if (it.tipo === "sync") return copiar("/sincronizar-correo");
      if (it.tipo === "repaso") return copiar("/repaso-semanal");
      if (it.tipo === "aprender") return copiar(pedidoAprender(casaActual.p));
      if (it.tipo === "ficha") return copiar("Armá la ficha de la empresa de la postulación " + casaActual.p.empresa + " (postulaciones/" + casaActual.p.id +
        "/empresa.md), como dice «La ficha de la empresa» en .claude/skills/analizar-oferta/SKILL.md, con plantillas/empresa.md.");
      if (it.tipo === "nuevaPractica") return copiar("/preparar-entrevista Quiero practicar una entrevista. Preguntame para qué empresa y qué instancia es, y armá la práctica en el navegador (entrevistas/<empresa>/practica.json) para practicarla desde el tablero.");
      if (it.tipo === "posicionamiento") return copiar("/posicionamiento");
      return nada();
    }
    if (k === "d") {
      if (!it || it.tipo !== "accion") return nada();
      dlg.confirmar = true; sonar([440], "square", 0.05); pintarDialogo();
      return;
    }
    if (k === "m") { config.minimapa = !config.minimapa; guardarConfig(); return; }
    if (k === "a" || k === "enter" || k === " ") {
      if ((dlg.tipo === "prioridades" || dlg.tipo === "calendario") && it) return irA(it.a);
      if (dlg.tipo === "cosa" && dlg.cosa.tipo === "casa" && dlg.cosa.ent.zona === "cerrada") {
        var cerrada = dlg.cosa.ent; cerrar();
        return bajarseYEntrar(function () { entrar(cerrada); });
      }
      if (it && it.tipo === "practica") { sonar([523, 659]); window.open("practica.html?e=" + encodeURIComponent(it.carpeta), "_blank"); return; }
      if (it && it.tipo === "preparar" && practicaDe[casaActual.p.id]) {
        sonar([523, 659]);
        window.open("practica.html?e=" + encodeURIComponent(practicaDe[casaActual.p.id]), "_blank");
        return;
      }
      cerrar();
      return;
    }
    if (k === "escape") cerrar();
  }

  addEventListener("keydown", function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey || !mapa) return;
    if (primerGesto) { primerGesto = false; if (config.musica) prenderMusica(); } // el navegador pide un gesto antes de sonar
    var k = ev.key.toLowerCase();
    if (enTransicion) { ev.preventDefault(); return; }
    if (dialogoAbierto) { if (!ev.repeat || DIRS[ev.key]) teclaEnDialogo(ev, k); else ev.preventDefault(); return; }
    if (DIRS[ev.key]) {
      ev.preventDefault();
      if (pj.ruta) { pj.ruta = null; pj.alLlegar = null; }
      if (apretadas.indexOf(ev.key) < 0) apretadas.push(ev.key);
      if (!ev.repeat) toque = ev.key;
      return;
    }
    if (ev.repeat) return;
    if (k === "m") { ev.preventDefault(); config.minimapa = !config.minimapa; guardarConfig(); sonar([523], "square", 0.05); return; }
    if (k === "enter") { ev.preventDefault(); if (!pj.mueve || pj.ruta) { pj.ruta = null; pj.alLlegar = null; abrirLista("prioridades", 0); } return; }
    if (k === "a" || k === " ") { ev.preventDefault(); if (!pj.mueve) mirar(); return; }
    if (k === "s" || k === "d") { ev.preventDefault(); nada(); }
  });
  addEventListener("keyup", function (ev) {
    var i = apretadas.indexOf(ev.key);
    if (i >= 0) apretadas.splice(i, 1);
  });
  addEventListener("blur", function () { apretadas = []; });
  addEventListener("resize", ajustar);

  // ---------- arranque ----------
  cargarDatos(function (datos) {
    prepararFiguras();
    datosActuales = datos;
    armarTodoElPueblo();
    mapa = pueblo.mapa; capaFija = pueblo.capa;
    if (config.velocidad === 1) bici = { x: mapa.miCasa.bici.x, y: mapa.miCasa.bici.y };
    var pos = config.pos;
    if (pos && libre(pos.x, pos.y)) ubicar(pos.x, pos.y, pos.mira || "abajo");
    else ubicar(mapa.inicio.x, mapa.inicio.y, "arriba");
    actualizarHud();
    actualizarAyuda();
    cargarPracticas();
    ajustar();
    var antes = performance.now();
    (function cuadro(ahora) {
      actualizar(Math.min(0.05, (ahora - antes) / 1000));
      antes = ahora;
      dibujar(ahora);
      requestAnimationFrame(cuadro);
    })(antes);
  });
})();
</script>
